name: WordPress + Elementor smoke + reference-host compatibility

# Free-Elementor CI plus a bounded REFERENCE-HOST COMPATIBILITY CI phase.
# This is a HOST-PARITY SIMULATION, never real-host acceptance: no host access,
# LiteSpeed, Elementor Pro, real email, or clean Pro kit import is performed.
# A separate job builds the Koorosh TEST-HOST TRANSFER PACKAGE (test build, never a release).
# WordPress/Elementor pins and owner-reported evidence are tracked in
# reconstruction/manifest.json and its reference_host_compatibility_ci block.
# PHP is family-only; exact MariaDB and LiteSpeed parity are not tested.
# Green CI is evidence bound to this commit only; it is NOT host acceptance.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wp-smoke-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static validation (JSON/YAML/pins)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run static validation
        run: bash tests/static/validate.sh

  wp-elementor-smoke:
    name: Clean WordPress + Free Elementor + reference-host compatibility (wp-env)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked WordPress and browser tooling
        run: |
          # Public-package bootstrap: expose bounded diagnostics through annotations
          # as well as log blobs (the latter can be unreachable from review sandboxes).
          if ! npm ci --prefix tests/browser --no-fund --no-audit > /tmp/wp-env-install.log 2>&1; then
            tail -20 /tmp/wp-env-install.log
            detail=$(tail -12 /tmp/wp-env-install.log | tr '\n' ' ')
            echo "::error title=wp-env package bootstrap::$detail"
            exit 1
          fi
          echo "$GITHUB_WORKSPACE/tests/browser/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Start clean WordPress environment with pinned free Elementor
        run: |
          # Expose the start-up failure reason through an annotation: log blobs are not
          # always reachable from review sandboxes (same pattern as the package bootstrap).
          if ! wp-env start > /tmp/wp-env-start.log 2>&1; then
            tail -25 /tmp/wp-env-start.log
            detail=$(tail -15 /tmp/wp-env-start.log | tr '\n' ' ')
            echo "::error title=wp-env start failed::$detail"
            exit 1
          fi
          tail -5 /tmp/wp-env-start.log

      - name: Run runtime smoke test
        run: bash tests/wp-env/smoke.sh

      - name: Install bounded browser tooling
        run: |
          cd tests/browser
          npx playwright install --with-deps chromium

      - name: Test isolated interactive HTML design preview
        run: node tests/browser/visual-preview.mjs

      - name: Reconstruct native Free homepage and capture browser evidence
        run: node tests/browser/homepage.mjs

      - name: Reconstruct native Free Product Overview and capture browser evidence
        run: node tests/browser/product-overview.mjs

      - name: Reconstruct native Free Demo conversion page and capture browser evidence
        run: node tests/browser/demo.mjs

      - name: Prove Demo lead-delivery states (default OFF, intercepted live-mode simulation, honest failure)
        run: node tests/browser/demo-delivery.mjs

      - name: Reconstruct native Free appointment/reception/queue workflow page and capture browser evidence
        run: node tests/browser/appointment-reception-queue.mjs

      - name: Reconstruct native Free patient-record/continuity page and capture browser evidence
        run: node tests/browser/patient-record-continuity.mjs

      - name: Reconstruct native Free doctor-workspace page and capture browser evidence
        run: node tests/browser/doctor-workspace.mjs

      - name: Reconstruct native Free patient-portal page and capture browser evidence
        run: node tests/browser/patient-portal.mjs

      - name: Reconstruct native Free prescriptions-and-documents page and capture browser evidence
        run: node tests/browser/prescriptions-documents.mjs

      - name: Reconstruct native Free FAQ / buyer-objection page and capture browser evidence
        run: node tests/browser/faq.mjs

      - name: Reconstruct native Free Security & Data Access trust page and capture browser evidence
        run: node tests/browser/security-data-access.mjs

      - name: Reconstruct native Free Privacy utility page and capture browser evidence
        run: node tests/browser/privacy.mjs

      - name: Reconstruct native Free Website Terms utility page and capture browser evidence
        run: node tests/browser/terms.mjs

      - name: Reconstruct native Free Contact utility page and capture browser evidence
        run: node tests/browser/contact.mjs

      - name: Reconstruct WordPress navigation menus and capture site-shell evidence
        run: node tests/browser/site-shell.mjs

      - name: Capture technical-SEO / indexability evidence (development expectation + simulated launch switch)
        run: node tests/browser/seo-foundation.mjs

      - name: Prove Koorosh Theme Settings (admin screen, sanitization, capabilities, dual-gate status, read-only site status)
        run: node tests/browser/theme-settings.mjs

      - name: REFERENCE-HOST COMPATIBILITY CI (host-parity simulation; no Pro/LiteSpeed/real mail)
        env:
          REFERENCE_REPORT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/wp-env/reference-host-compatibility.mjs

      - name: Upload reference-host compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reference-host-compatibility-${{ github.event.pull_request.head.sha || github.sha }}
          path: tests/browser/artifacts/reference-host-compatibility/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload homepage, Product Overview, Demo, lead-delivery, workflow, FAQ, Security & Data Access, Contact page and site-shell evidence (also on failure; includes the patient-record/continuity, doctor-workspace, patient-portal, prescriptions-documents, Privacy and Terms pages)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: page-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: tests/browser/artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "=== logs: $c ==="
            docker logs --tail 60 "$c" 2>&1 || true
          done

  koorosh-transfer-package:
    name: Koorosh TEST-HOST TRANSFER PACKAGE (build, validate, install ZIP into clean WordPress)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Test build only: NOT a production release, NOT publication authorization, NOT Elementor Pro /
    # LiteSpeed / real-host acceptance. Top-level workflow permissions stay read-only; only this job
    # grants job-scoped write permission so that on `main` (and only after validation and ZIP-install
    # proof succeed) it publishes/updates the GitHub PRE-RELEASE `koorosh-test-v<version>` with direct
    # clickable assets (`koorosh-<version>-test-build-<sha12>.zip`, `koorosh-transfer-manifest.json`,
    # `SHA256SUMS`) in addition to the 14-day workflow artifact.
    permissions:
      contents: write
    steps:
      - name: Check out the exact source SHA (not the PR merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Package self-tests (determinism, inventory, checksums, negative fixtures)
        run: python3 tests/package/test_package.py

      - name: Build Koorosh transfer package (ZIP + manifest + SHA256SUMS)
        env:
          KOOROSH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/package-koorosh-theme.py --require-clean --out-dir dist/transfer
          # Independent second build must be byte-identical (deterministic ZIP).
          python3 scripts/package-koorosh-theme.py --require-clean --out-dir dist/transfer-verify
          cmp dist/transfer/koorosh-*-test-build-*.zip dist/transfer-verify/koorosh-*-test-build-*.zip
          rm -rf dist/transfer-verify
          (cd dist/transfer && sha256sum -c SHA256SUMS)

      - name: Validate package (layout, identity, inventory, forbidden files, manifest flags)
        run: python3 tests/package/validate_package.py dist/transfer --expect-sha "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Install locked wp-env tooling
        run: |
          if ! npm ci --prefix tests/browser --no-fund --no-audit > /tmp/wp-env-install.log 2>&1; then
            tail -20 /tmp/wp-env-install.log
            detail=$(tail -12 /tmp/wp-env-install.log | tr '\n' ' ')
            echo "::error title=wp-env package bootstrap::$detail"
            exit 1
          fi
          echo "$GITHUB_WORKSPACE/tests/browser/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Start CLEAN WordPress + pinned free Elementor (no theme mapped from source)
        run: |
          mkdir -p tests/package/pkg
          cp dist/transfer/* tests/package/pkg/
          cd tests/package
          if ! wp-env start > /tmp/wp-env-pkg-start.log 2>&1; then
            tail -25 /tmp/wp-env-pkg-start.log
            detail=$(tail -15 /tmp/wp-env-pkg-start.log | tr '\n' ' ')
            echo "::error title=wp-env start failed (package job)::$detail"
            exit 1
          fi
          tail -5 /tmp/wp-env-pkg-start.log

      - name: Install the ZIP into clean WordPress, activate, and verify
        run: bash tests/package/install-check.sh

      - name: Record package identity (annotation + job summary)
        run: |
          node -e '
          const m = JSON.parse(require("fs").readFileSync("dist/transfer/koorosh-transfer-manifest.json", "utf8"));
          const line = `${m.zip_file} sha256=${m.zip_sha256} source=${m.source_commit_sha} theme=${m.theme_slug}@${m.theme_version} elementor_pro_included=${m.elementor_pro_included} production_release=${m.production_release} publication_authorized=${m.publication_authorized}`;
          console.log(`::notice title=TEST-HOST TRANSFER PACKAGE::${line}`);
          require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### TEST-HOST TRANSFER PACKAGE (test build, not a release)\n\n- ZIP: \`${m.zip_file}\`\n- SHA-256: \`${m.zip_sha256}\`\n- Source commit: \`${m.source_commit_sha}\`\n- Theme: \`${m.theme_slug}\` ${m.theme_version}\n- Elementor Pro included: ${m.elementor_pro_included}; production release: ${m.production_release}; publication authorized: ${m.publication_authorized}\n- Host / Pro / LiteSpeed acceptance: NOT RUN\n`);
          '

      - name: Upload TEST-HOST TRANSFER PACKAGE artifact (only after validation and ZIP-install proof)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: koorosh-test-host-transfer-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/transfer/
          if-no-files-found: error
          retention-days: 14

      - name: Publish TEST-HOST TRANSFER PACKAGE pre-release (main only, after validation and ZIP-install proof)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          eval "$(node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("dist/transfer/koorosh-transfer-manifest.json", "utf8"));
            if (m.elementor_pro_included !== false || m.production_release !== false || m.publication_authorized !== false) {
              process.exit(1);
            }
            const tag = `koorosh-test-v${m.theme_version}`;
            const title = `Koorosh ${m.theme_version} — Test Host Transfer Build`;
            const repo = m.repository || process.env.GITHUB_REPOSITORY;
            const notes = [
              "**TEST-HOST TRANSFER PACKAGE (PRE-RELEASE / TEST BUILD ONLY)**",
              "",
              "- **Not a production release (`production_release: false`).**",
              "- **Not publication or search-engine indexing authorization (`publication_authorized: false`).**",
              "- **Not Elementor Pro, LiteSpeed, or real-host acceptance (`NOT RUN`).**",
              "- **No Elementor Pro package/license (`elementor_pro_included: false`) and no secrets/credentials are included.**",
              "",
              "### Package Identity",
              `- **Theme:** کوروش (\`koorosh\`) \`${m.theme_version}\` (standalone WordPress theme; no parent theme required)`,
              `- **Source commit (\`main\`):** \`${m.source_commit_sha}\``,
              `- **Installable theme ZIP:** \`${m.zip_file}\``,
              `- **Theme ZIP SHA-256:** \`${m.zip_sha256}\``,
              "- **Manifest:** `koorosh-transfer-manifest.json`",
              "- **Checksums:** `SHA256SUMS`",
              "",
              "### Direct Download & WordPress Upload (Test Host Only)",
              `1. Download **\`${m.zip_file}\`** directly from **Assets** below (no outer wrapper ZIP to extract).`,
              `2. In WordPress Admin on the authorized non-public test host: **Appearance → Themes → Add New → Upload Theme** → choose \`${m.zip_file}\` → **Install Now** → **Activate**.`,
              `3. Follow the procedure and safety boundaries in [\`docs/TEST-HOST-TRANSFER.md\`](https://github.com/${repo}/blob/${m.source_commit_sha}/docs/TEST-HOST-TRANSFER.md) (keep lead delivery OFF and keep search-engine indexing discouraged).`,
              "",
            ].join("\n");
            fs.writeFileSync("dist/transfer-release-notes.md", notes, "utf8");
            console.log("TAG=" + JSON.stringify(tag));
            console.log("TITLE=" + JSON.stringify(title));
            console.log("ZIP_FILE=" + JSON.stringify(m.zip_file));
            console.log("SOURCE_SHA=" + JSON.stringify(m.source_commit_sha));
          ')"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "dist/transfer/${ZIP_FILE}" \
            "dist/transfer/koorosh-transfer-manifest.json" \
            "dist/transfer/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$TITLE" \
            --notes-file dist/transfer-release-notes.md \
            --prerelease
          rm -f dist/transfer-release-notes.md
          REL_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          REL_JSON="$REL_JSON" EXPECT_TAG="$TAG" EXPECT_SHA="$SOURCE_SHA" EXPECT_ZIP="$ZIP_FILE" node -e '
            const r = JSON.parse(process.env.REL_JSON);
            if (r.tag_name !== process.env.EXPECT_TAG) throw new Error("tag mismatch: " + r.tag_name);
            if (r.target_commitish !== process.env.EXPECT_SHA) throw new Error("target_commitish mismatch: " + r.target_commitish);
            if (r.prerelease !== true || r.draft !== false) throw new Error("release must be published prerelease");
            const names = (r.assets || []).map(a => a.name).sort();
            const want = [process.env.EXPECT_ZIP, "SHA256SUMS", "koorosh-transfer-manifest.json"].sort();
            if (JSON.stringify(names) !== JSON.stringify(want)) throw new Error("unexpected assets: " + JSON.stringify(names));
            const zipAsset = r.assets.find(a => a.name === process.env.EXPECT_ZIP);
            console.log(`::notice title=TEST-HOST PRE-RELEASE::tag=${r.tag_name} prerelease=${r.prerelease} target=${r.target_commitish} release_url=${r.html_url} zip_asset_url=${zipAsset.browser_download_url}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n### Owner Direct Download (GitHub Pre-release)\n\n- Tag: \`${r.tag_name}\` (pre-release: \`${r.prerelease}\`)\n- Release page: ${r.html_url}\n- Direct installable ZIP: ${zipAsset.browser_download_url}\n`);
          '

      - name: Collect container logs on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "=== logs: $c ==="
            docker logs --tail 60 "$c" 2>&1 || true
          done
